name: Build FireBot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Configure release version & persistent keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const ref = process.env.GITHUB_REF || "";
            if (ref.startsWith("refs/tags/v")) {
              cfg.expo.version = ref.replace("refs/tags/v", "");
            }
            cfg.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER || 1);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p certs
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > certs/release.keystore
            echo "Restored persistent release keystore from GitHub Secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; using Expo default debug keystore."
          fi

      - name: Generate Android project with Expo Prebuild
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx expo prebuild --platform android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebot-control-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (on version tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp android/app/build/outputs/apk/release/app-release.apk "FireBotControl-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "FireBotControl-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "FireBotControl-${TAG}.apk" \
              --title "FireBot Control $TAG" \
              --notes "Automated APK release $TAG (build #${GITHUB_RUN_NUMBER})."
          fi
